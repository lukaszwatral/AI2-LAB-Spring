<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Person details</title>
</head>
<body>
<h1>Person details</h1>
<p>ID: <span th:text="${person.id}"></span></p>
<p>First name: <span th:text="${person.firstName}"></span></p>
<p>Family name: <span th:text="${person.familyName}"></span></p>

<a th:href="@{|/people/${person.id}/edit|}">Edit</a>
<form th:action="@{|/people/${person.id}/remove|}" method="post" style="display:inline;">
    <button type="submit">Remove</button>
</form>
<br>
<a th:href="@{'/people'}">Back to list</a>

</body>
</html>
